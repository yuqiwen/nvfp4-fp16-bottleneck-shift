run:
  output_path: results/llama31_8b_transformers_smoke.jsonl
  warmup_iters: 0
  timed_iters: 1
  synthetic_prompt_token_count: 32
  max_output_tokens: 4
  batch_sizes: [1]
  seed: 1234

runtime:
  backend: transformers
  dtype: bfloat16
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  max_batch_size: 1
  max_num_tokens: 256
  trust_remote_code: true
  kv_cache_dtype: null

experiments:
  - name: llama31_8b_fp16_transformers
    precision: fp16
    enabled: true
    model: meta-llama/Llama-3.1-8B-Instruct
    quantization:
      mode: none
