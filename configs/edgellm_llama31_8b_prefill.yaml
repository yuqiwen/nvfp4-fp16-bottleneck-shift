workspace_dir: ~/tensorrt-edgellm-workspace
edgellm_repo: ~/TensorRT-Edge-LLM

model:
  name: Llama-3.1-8B-Instruct
  hf_id: meta-llama/Llama-3.1-8B-Instruct

build:
  max_batch_size: 1
  max_input_len: 1024
  max_kv_cache_capacity: 4096

run:
  name: prefill
  batch_size: 1
  temperature: 0.0
  top_p: 1.0
  top_k: 1
  max_generate_length: 1
  prompt: >-
    Analyze GPU inference bottlenecks for transformer language models. Focus on
    how precision formats change arithmetic intensity, memory bandwidth demand,
    cache behavior, tensor core utilization, dequantization overhead, and kernel
    scheduling. During prefill, the model processes the full prompt in parallel,
    so long sequence matrix multiplications, attention score computation, MLP
    projections, layer normalization, rotary embedding, and key value cache
    writes dominate the workload. FP16 stores weights and activations with wider
    elements, while FP8 and NVFP4 reduce data movement and may shift pressure
    toward tensor core throughput, scale handling, memory layout conversion, or
    small auxiliary kernels. The important question is whether reduced precision
    changes the bottleneck from bandwidth to compute, from compute to memory, or
    from large GEMM kernels to overheads around quantization and cache updates.
    Compare the behavior using Nsight Systems for timeline structure and Nsight
    Compute for kernel-level throughput, occupancy, cache usage, memory
    transactions, warp stalls, and roofline placement. Repeat this analysis for
    many transformer layers and describe how the prefill phase differs from the
    decode phase. Analyze GPU inference bottlenecks for transformer language
    models. Focus on how precision formats change arithmetic intensity, memory
    bandwidth demand, cache behavior, tensor core utilization, dequantization
    overhead, and kernel scheduling. During prefill, the model processes the
    full prompt in parallel, so long sequence matrix multiplications, attention
    score computation, MLP projections, layer normalization, rotary embedding,
    and key value cache writes dominate the workload. FP16 stores weights and
    activations with wider elements, while FP8 and NVFP4 reduce data movement
    and may shift pressure toward tensor core throughput, scale handling, memory
    layout conversion, or small auxiliary kernels. The important question is
    whether reduced precision changes the bottleneck from bandwidth to compute,
    from compute to memory, or from large GEMM kernels to overheads around
    quantization and cache updates. Compare the behavior using Nsight Systems
    for timeline structure and Nsight Compute for kernel-level throughput,
    occupancy, cache usage, memory transactions, warp stalls, and roofline
    placement. Repeat this analysis for many transformer layers and describe how
    the prefill phase differs from the decode phase.

experiments:
  - name: llama31_8b_fp16
    precision: fp16
    quantization: none
    enabled: true

  - name: llama31_8b_fp8
    precision: fp8
    quantization: fp8
    enabled: true

  - name: llama31_8b_nvfp4
    precision: nvfp4
    quantization: nvfp4
    enabled: true
